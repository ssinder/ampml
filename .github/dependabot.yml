version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "bot"
    commit-message:
      prefix: "deps"
    groups:
      python-core:
        patterns:
          - "numpy"
          - "pandas"
          - "scipy"
          - "matplotlib"
          - "seaborn"
      ml-stack:
        patterns:
          - "scikit-learn"
          - "xgboost"
          - "shap"
          - "joblib"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "dependencies"
      - "bot"
    commit-message:
      prefix: "ci"
