name: Repository metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repo-metadata.yml"

permissions:
  contents: write
  metadata: write

jobs:
  metadata:
    name: Sync description and topics
    runs-on: ubuntu-latest
    steps:
      - name: Update repository description and topics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DESCRIPTION: >-
            Reproducible, auditable benchmark for antimicrobial peptide
            classification: 4921 features, 6 models, 30-check verification
            audit, and a quantified study of negative-sample bias.
          TOPICS: >-
            antimicrobial-peptides
            amp
            peptides
            proteins
            bioinformatics
            machine-learning
            drug-discovery
            shap
            reproducibility
            computational-biology
        run: |
          set -euo pipefail

          api() {
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          echo "::notice::current description: $(api "https://api.github.com/repos/$REPO" | jq -r .description)"
          echo "::notice::current topics: $(api "https://api.github.com/repos/$REPO/topics" | jq -r '.names | join(", ")')"

          # PUT /topics replaces the entire set, so the existing topics and
          # the desired ones are merged and submitted in a single request.
          # Sending them one by one would leave only the last topic in place.
          MERGED=$(
            { api "https://api.github.com/repos/$REPO/topics" | jq -r '.names[]'
              printf '%s\n' $TOPICS
            } | sort -u | jq -R . | jq -s '{names: .}'
          )

          echo "::notice::writing topics payload: $MERGED"
          api --method PUT \
            -H "Content-Type: application/json" \
            -d "$MERGED" \
            "https://api.github.com/repos/$REPO/topics" >/dev/null

          jq -n --arg d "$DESCRIPTION" '{description: $d}' > /tmp/desc.json
          api --method PATCH \
            -H "Content-Type: application/json" \
            --data @/tmp/desc.json \
            "https://api.github.com/repos/$REPO" >/dev/null

          echo "::notice::new description: $(api "https://api.github.com/repos/$REPO" | jq -r .description)"
          echo "::notice::new topics: $(api "https://api.github.com/repos/$REPO/topics" | jq -r '.names | join(", ")')"
