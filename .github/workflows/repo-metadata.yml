name: Repository metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repo-metadata.yml"

permissions:
  contents: read

jobs:
  metadata:
    name: Verify description and topics
    runs-on: ubuntu-latest
    steps:
      - name: Compare repository metadata with the expected values
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EXPECTED_DESCRIPTION: >-
            Reproducible, auditable benchmark for antimicrobial peptide
            classification: 4921 features, 6 models, a 30-check verification
            audit, and a quantified study of negative-sample bias.
          EXPECTED_TOPICS: >-
            amp
            antimicrobial-peptides
            bioinformatics
            computational-biology
            drug-discovery
            machine-learning
            peptides
            proteins
            reproducibility
            shap
        run: |
          set -euo pipefail

          api() {
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          ACTUAL_DESCRIPTION=$(api "https://api.github.com/repos/$REPO" | jq -r '.description // ""')
          ACTUAL_TOPICS=$(api "https://api.github.com/repos/$REPO/topics" | jq -r '.names | sort | join(" ")')
          EXPECTED_TOPICS_SORTED=$(printf '%s\n' $EXPECTED_TOPICS | tr ' ' '\n' | grep -v '^$' | sort | tr '\n' ' ' | sed 's/ $//')

          echo "::notice::description: ${ACTUAL_DESCRIPTION}"
          echo "::notice::topics: ${ACTUAL_TOPICS}"

          failed=0

          if [ "${ACTUAL_DESCRIPTION}" != "${EXPECTED_DESCRIPTION}" ]; then
            echo "::error::description does not match the expected value"
            echo "expected: ${EXPECTED_DESCRIPTION}"
            echo "actual  : ${ACTUAL_DESCRIPTION}"
            failed=1
          else
            echo "::notice::description matches"
          fi

          if [ "${ACTUAL_TOPICS}" != "${EXPECTED_TOPICS_SORTED}" ]; then
            echo "::error::topics do not match the expected set"
            echo "expected: ${EXPECTED_TOPICS_SORTED}"
            echo "actual  : ${ACTUAL_TOPICS}"
            failed=1
          else
            echo "::notice::topics match"
          fi

          # The description and the topics live in the repository settings
          # rather than in this repository, so a workflow cannot write them:
          # the GitHub App token that Actions provides carries no
          # administration scope. This check therefore reports drift only.
          exit $failed
