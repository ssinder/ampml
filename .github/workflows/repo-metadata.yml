name: Repository metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repo-metadata.yml"

permissions:
  contents: write

jobs:
  metadata:
    name: Sync description and topics
    runs-on: ubuntu-latest
    steps:
      - name: Update repository description and topics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DESCRIPTION: >-
            Reproducible, auditable benchmark for antimicrobial peptide
            classification: 4921 features, 6 models, 30-check verification
            audit, and a quantified study of negative-sample bias.
          TOPICS: >-
            antimicrobial-peptides
            amp
            peptides
            bioinformatics
            machine-learning
            drug-discovery
            shap
            reproducibility
            computational-biology
        run: |
          set -euo pipefail

          echo "::notice::current description: $(gh api "repos/$REPO" --jq .description)"
          echo "::notice::current topics: $(gh api "repos/$REPO/topics" --jq '.names | join(", ")')"

          # PUT /topics replaces the entire set, so the existing topics and
          # the desired ones are merged and submitted in a single request.
          # Sending them one by one would leave only the last topic set.
          python - <<'PY'
          import json, os, subprocess

          repo = os.environ["REPO"]
          token = os.environ["GITHUB_TOKEN"]
          existing = subprocess.run(
              ["gh", "api", f"repos/{repo}/topics", "--jq", ".names | join(\" \")"],
              capture_output=True, text=True, check=True).stdout.split()
          desired = os.environ["TOPICS"].split()
          merged = sorted(set(existing) | set(desired))

          payload = json.dumps({"names": merged})
          print("::notice::writing topics:", ", ".join(merged))
          subprocess.run(
              ["gh", "api", "--method", "PUT", f"repos/{repo}/topics",
               "--input", "-"],
              input=payload, text=True, check=True,
              env={**os.environ, "GH_TOKEN": token})
          PY

          gh api --method PATCH "repos/$REPO" \
            -f description="$DESCRIPTION" >/dev/null

          echo "::notice::new description: $(gh api "repos/$REPO" --jq .description)"
          echo "::notice::new topics: $(gh api "repos/$REPO/topics" --jq '.names | join(", ")')"
