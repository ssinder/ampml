name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME}"
          # CHANGELOG headings use the bare semver ("## [0.1.0]"), while the
          # git tag carries the "v" prefix. Accept either form.
          VERSION="${TAG#v}"
          if ! grep -qE "^\[${VERSION}\]" CHANGELOG.md && ! grep -qE "^\[${TAG}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${TAG}"
            exit 1
          fi
      - name: Fetch upstream feature table
        uses: ./.github/actions/fetch-features
      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          files: |
            rawdata/all_features_combined_standard.csv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
