name: Stale

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,good first issue,help wanted"
          exempt-pr-labels: "pinned,security"
          stale-issue-message: >
            This issue has been inactive for 60 days and will be closed in 14 days.
            If the problem still exists, please reopen with a fresh reproduction —
            stale issues often go stale because the environment changed.
          stale-pr-message: >
            This pull request has been inactive for 60 days. It will be closed in 14 days.
            Comment to keep it alive.
          close-issue-message: >
            Closing this issue as stale. Please reopen if it still applies.
          close-pr-message: >
            Closing this pull request as stale. Comment to reopen.
